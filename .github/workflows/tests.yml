name: Tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Undefinierte Namen (pyflakes)
        # Diese Fehlerklasse lief bisher still in try/except (siehe 01.11.2026).
        run: |
          python -m pyflakes *.py tests/*.py tools/*.py | grep "undefined name" && exit 1 || echo "keine undefinierten Namen"

      - name: Offline-Tests
        env:
          PYTHON: python
        run: ./run_tests.sh
