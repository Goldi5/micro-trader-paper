name: Handbuch

# Erzeugt docs/handbuch/HANDBUCH.md als PDF.
# - Release veroeffentlicht -> PDF wird an das Release angehaengt.
# - Push auf main          -> PDF als Artefakt und am neuesten Release ersetzt.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "docs/handbuch/**"
      - "tools/handbuch_pdf*.py"
      - ".github/workflows/handbuch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fuer git describe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Gestaltetes PDF: markdown + Chrome (auf ubuntu-latest vorinstalliert).
      # reportlab nur fuer den einfachen Ersatzweg.
      - name: Pakete installieren
        run: pip install "markdown==3.10" "reportlab==5.0.1"

      - name: PDF erzeugen
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Push auf main: Version des letzten Release-Tags (ohne -N-gHASH)
          [ -n "$VERSION" ] || VERSION="$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python tools/handbuch_pdf.py --version "$VERSION" \
            --aus "Micro-Trader-Handbuch-$VERSION.pdf"

      # Zwei Namen: fester Name fuer den README-Link (releases/latest/download/...)
      # und einer mit Version. Push auf main ersetzt das PDF am neuesten Release.
      - name: An das Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Micro-Trader-Handbuch-$VERSION.pdf" Micro-Trader-Handbuch.pdf
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$VERSION"
          else
            TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "Noch kein Release - nur Artefakt."
            exit 0
          fi
          gh release upload "$TAG" Micro-Trader-Handbuch.pdf --clobber
          if [ "$TAG" = "$VERSION" ]; then
            gh release upload "$TAG" "Micro-Trader-Handbuch-$VERSION.pdf" --clobber
          fi

      - name: Als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Micro-Trader-Handbuch-${{ env.VERSION }}
          path: Micro-Trader-Handbuch-*.pdf
